<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" width="220" height="60" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF566"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Filter for glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#b45309" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g transform="translate(10, 0)">
    <!-- Knife / Blade Icon -->
    <g transform="translate(0, 8) rotate(-15)">
      <!-- Blade Glow -->
      <path d="M12 28 C 12 28, 22 26, 32 18 C 38 12, 42 4, 42 4 C 42 4, 38 18, 28 26 C 20 32, 12 32, 12 28 Z" 
            fill="url(#bladeGrad)" filter="url(#glow)" opacity="0.6"/>
      <!-- Main Blade -->
      <path d="M10 26 C 10 26, 20 25, 30 17 C 36 12, 40 4, 40 4 C 40 4, 36 16, 26 24 C 18 30, 10 30, 10 26 Z" 
            fill="url(#bladeGrad)" stroke="#ffffff" stroke-width="1"/>
      <!-- Blade Edge Highlight -->
      <path d="M10 26 C 18 30, 26 24, 40 4" 
            stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Handle -->
      <path d="M2 34 L 10 26 L 14 30 L 6 38 Z" 
            fill="url(#handleGrad)" stroke="#64748b" stroke-width="1" rx="2"/>
      <!-- Rivets on handle -->
      <circle cx="5" cy="33" r="1" fill="#94a3b8"/>
      <circle cx="8" cy="30" r="1" fill="#94a3b8"/>
      <!-- Sparkle on tip -->
      <path d="M38 4 L 40 0 L 42 4 L 46 6 L 42 8 L 40 12 L 38 8 L 34 6 Z" 
            fill="#ffffff" filter="url(#glow)"/>
    </g>

    <!-- Typography: SLICE -->
    <text x="46" y="34" 
          font-family="'Arial Black', 'Impact', 'Montserrat', sans-serif" 
          font-size="28" 
          font-weight="900" 
          letter-spacing="1.5" 
          fill="url(#whiteGrad)" 
          filter="url(#textShadow)"
          stroke="#0f172a" 
          stroke-width="1.5">SLICE</text>

    <!-- Slice Slash effect line -->
    <path d="M44 38 Q 110 36, 175 32" 
          stroke="url(#bladeGrad)" 
          stroke-width="3" 
          stroke-linecap="round" 
          filter="url(#glow)"/>
    <path d="M44 38 Q 110 36, 175 32" 
          stroke="#ffffff" 
          stroke-width="1.5" 
          stroke-linecap="round"/>

    <!-- Typography: MASTER -->
    <text x="48" y="58" 
          font-family="'Arial Black', 'Impact', 'Montserrat', sans-serif" 
          font-size="22" 
          font-weight="900" 
          letter-spacing="3" 
          fill="url(#goldGrad)" 
          filter="url(#goldGlow)"
          stroke="#78350f" 
          stroke-width="1.2">MASTER</text>

    <!-- Mini sparkle star near MASTER -->
    <path d="M178 48 L 180 44 L 182 48 L 186 50 L 182 52 L 180 56 L 178 52 L 174 50 Z" 
          fill="#FFF566" opacity="0.9" filter="url(#glow)"/>
  </g>
</svg>
